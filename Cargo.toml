[package]
name = "windows-deck"
version = "0.2.4"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Stream Deck style touch panel for windows-link buttons"
repository = "https://github.com/miyabisun/windows-deck"

[lib]
name = "windows_deck"

[[bin]]
name = "windows-deck"
path = "src/main.rs"

[dependencies]
# GPUI is published as weekly snapshots of Zed (gpui-pre); any snapshot may change its API, so the
# version is pinned exactly and raised on purpose.
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11" }
http_client = { package = "gpui-pre-http-client", version = "=0.3.11" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
percent-encoding = "2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
tracing = "0.1"
unicode-segmentation = "1"
url = "2"
tracing-subscriber = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-normalization = "0.1"
ureq = "3"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
wry = { version = "0.57", default-features = false }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }

[build-dependencies]
embed-resource = "3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
