[package]
name = "windows-deck"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Stream Deck style touch panel for windows-link buttons"
repository = "https://github.com/miyabisun/windows-deck"

[lib]
name = "windows_deck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
tauri = { version = "2", features = [] }

[lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
