[package]
name = "windows-deck"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Stream Deck style touch panel for windows-link buttons"
repository = "https://github.com/miyabisun/windows-deck"

[lib]
name = "windows_deck_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
